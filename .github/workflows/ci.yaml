name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - 'deploy/**'
      - 'README.md'
      - 'CLAUDE.md'
      - 'LICENSE'
  pull_request:
    branches: [main]
  # 手动补建通道:CI-only 改动(paths-ignore/workflow 文件)不触发 docker,
  # 修完 CI 后 main 会出现"源码新但无对应镜像"的断档,dispatch 跑全链补建。
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  check:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build

  changes:
    name: Detect Source Changes
    # dispatch 走 docker 的显式白名单分支,paths-filter 在非 push 事件下行为不定,跳过
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src:
              - 'src/**'
              - 'public/**'
              - 'package.json'
              - 'bun.lock'
              - 'Dockerfile'
              - '.dockerignore'
              - 'next.config.ts'
              - 'tsconfig.json'
              - 'postcss.config.mjs'

  e2e:
    name: E2E smoke (CDP)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Start server (:3000)
        # output:standalone 下 `next start` 只打印 Ready 不服务(Next 16 自身警告
        # 指明用 standalone server.js)。与 Dockerfile 生产起法保持同源。
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          bun .next/standalone/server.js &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:3000/ >/dev/null && break
            sleep 2
          done
      - name: Start headless Chrome (:9222)
        run: |
          google-chrome --headless=new --remote-debugging-port=9222 --no-sandbox --disable-gpu &
          for _ in $(seq 1 15); do
            curl -sf http://127.0.0.1:9222/json/version >/dev/null && break
            sleep 1
          done
      - name: Smoke — HTTP 200 + render markers
        run: bun scripts/smoke.ts http://localhost:3000
      - name: Mobile overflow audit (375px)
        run: bun scripts/check-mobile.ts http://localhost:3000

  lighthouse:
    name: Lighthouse (informational)
    needs: check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json

  docker:
    name: Build & Push Image
    needs: [check, changes, e2e]
    # !cancelled():dispatch 时 changes 被跳过,默认 needs 级联会把本 job 一起跳掉
    if: >-
      ${{ !cancelled() &&
          needs.check.result == 'success' &&
          needs.e2e.result == 'success' &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'push' && needs.changes.outputs.src == 'true')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=main-{{sha}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # GHCR packages default to private; Aliyun node pulls via NJU mirror
      # which requires public access. Attempt to inherit repo visibility.
      - name: Make package public (best-effort)
        continue-on-error: true
        run: |
          curl -sS -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/user/packages/container/$(echo '${{ env.IMAGE_NAME }}' | cut -d/ -f2)" \
            -d '{"visibility":"public"}' || true

  deploy:
    name: Update Deployment Tag
    needs: docker
    # 同 docker:job 级 success() 会被链上 skipped 的 changes 毒化,显式只看 docker
    if: ${{ !cancelled() && needs.docker.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update image tag in deployment manifest
        run: |
          SHA7=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG="main-${SHA7}"
          sed -i "s|image: ghcr.io/hanmahong5-arch/2c-bs-www-next:.*|image: ghcr.io/hanmahong5-arch/2c-bs-www-next:${TAG}|" deploy/k8s/deployment.yaml

      - name: Commit & push updated tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/k8s/deployment.yaml
          git diff --cached --quiet && exit 0
          git commit -m "deploy: update image tag to main-$(echo ${{ github.sha }} | cut -c1-7)"
          git push
